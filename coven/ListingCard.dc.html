<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="uploads/the-coven/docs/design/theme.css">
</helmet>
<a href="{{ card.href }}" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" onFocus="{{ enter }}" onBlur="{{ leave }}" style="display:flex;flex-direction:column;height:100%;background:var(--dusk);border:1px solid {{ border }};border-radius:var(--radius-md);overflow:hidden;text-decoration:none;color:var(--moonlight);font-family:var(--font-body);transition:box-shadow 250ms ease, border-color 250ms ease, transform 350ms cubic-bezier(.2,.7,.2,1);transform:translateY({{ lift }});box-shadow:{{ shadow }}">
<div style="position:relative;aspect-ratio:4/3;flex:none"><dc-import name="Artwork" style="position:absolute;inset:0" tint="{{ tint }}" seed="{{ card.title }}" hovered="{{ h }}" hint-size="100%,100%"></dc-import></div>
<div style="display:flex;flex-direction:column;gap:var(--space-2);padding:{{ card.pad }}">
<h3 style="margin:0;font-family:var(--font-display);font-size:20px;line-height:1.3;font-weight:600;color:{{ titleColor }};transition:color 250ms ease;text-wrap:pretty">{{ card.title }}</h3>
<span style="font-size:18px;line-height:1.2;font-weight:700;color:var(--mint);font-variant-numeric:tabular-nums">{{ card.price }}</span>
<span style="font-size:14px;line-height:1.5;color:var(--mist)">{{ card.meta }}</span>
</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;300px&quot;,&quot;height&quot;:&quot;380px&quot;},&quot;card&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;href&quot;:&quot;#&quot;,&quot;title&quot;:&quot;Sage &amp; lavender moon candle&quot;,&quot;price&quot;:&quot;$24.00&quot;,&quot;meta&quot;:&quot;Ships or pickup · Vera's Hearth, IL&quot;,&quot;pad&quot;:&quot;var(--space-4)&quot;},&quot;tsType&quot;:&quot;{href,title,price,meta,pad}&quot;}}">
class Component extends DCLogic {
  state = { h: false };
  renderVals() {
    const h = this.state.h;
    return { h, tint: (this.props.card || {}).tint || 'var(--violet)', lift: h ? '-4px' : '0px', shadow: h ? 'var(--glow-mint)' : 'none', border: h ? 'color-mix(in srgb, var(--mint) 50%, var(--outline))' : 'var(--outline)', titleColor: h ? 'var(--mint)' : 'var(--moonlight)',
      enter: () => this.setState({ h: true }), leave: () => this.setState({ h: false }) };
  }
}
</script>
</body>
</html>
