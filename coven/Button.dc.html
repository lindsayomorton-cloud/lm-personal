<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="uploads/the-coven/docs/design/theme.css">
</helmet>
<sc-if value="{{ isPrimary }}" hint-placeholder-val="{{ true }}">
<button type="{{ type }}" onClick="{{ onClick }}" style="display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;gap:var(--space-2);min-height:44px;padding:0 var(--space-6);border-radius:var(--radius-pill);border:1px solid var(--mint);background:var(--mint);color:var(--on-mint);font-family:var(--font-body);font-size:15px;line-height:1.2;font-weight:700;cursor:pointer;transition:transform 200ms cubic-bezier(.2,.7,.2,1), box-shadow 150ms ease, background-color 150ms ease, border-color 150ms ease;width:{{ width }};box-shadow:{{ restShadow }}" style-hover="box-shadow:var(--glow-mint);transform:translateY(-1px)" style-active="transform:translateY(0) scale(0.97)" style-focus="box-shadow:var(--glow-mint)">{{ label }}</button>
</sc-if>
<sc-if value="{{ isPrimaryDisabled }}" hint-placeholder-val="{{ false }}">
<button type="button" disabled="{{ true }}" style="display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-height:44px;padding:0 var(--space-6);border-radius:var(--radius-pill);border:1px solid var(--mint);background:var(--mint);color:var(--on-mint);font-family:var(--font-body);font-size:15px;line-height:1.2;font-weight:700;opacity:0.45;cursor:not-allowed;width:{{ width }}">{{ label }}</button>
</sc-if>
<sc-if value="{{ isSecondary }}" hint-placeholder-val="{{ false }}">
<button type="{{ type }}" onClick="{{ onClick }}" disabled="{{ disabled }}" style="display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-height:44px;padding:0 var(--space-6);border-radius:var(--radius-pill);border:1px solid var(--mint);background:transparent;color:var(--mint);font-family:var(--font-body);font-size:15px;line-height:1.2;font-weight:700;cursor:pointer;transition:transform 200ms cubic-bezier(.2,.7,.2,1), background-color 150ms ease, box-shadow 150ms ease;width:{{ width }};opacity:{{ opacity }}" style-hover="background:var(--twilight);transform:translateY(-1px)" style-active="transform:translateY(0) scale(0.97)">{{ label }}</button>
</sc-if>
<sc-if value="{{ isQuiet }}" hint-placeholder-val="{{ false }}">
<button type="{{ type }}" onClick="{{ onClick }}" disabled="{{ disabled }}" style="display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-height:44px;padding:0 var(--space-3);border-radius:var(--radius-pill);border:1px solid transparent;background:transparent;color:var(--moonlight);font-family:var(--font-body);font-size:15px;line-height:1.2;font-weight:700;cursor:pointer;transition:transform 200ms cubic-bezier(.2,.7,.2,1), color 150ms ease, background-color 150ms ease;width:{{ width }};opacity:{{ opacity }}" style-hover="color:var(--mint);background:var(--twilight);transform:translateY(-1px)" style-active="transform:translateY(0) scale(0.97)">{{ label }}</button>
</sc-if>
<sc-if value="{{ isDanger }}" hint-placeholder-val="{{ false }}">
<button type="{{ type }}" onClick="{{ onClick }}" disabled="{{ disabled }}" style="display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-height:44px;padding:0 var(--space-6);border-radius:var(--radius-pill);border:1px solid var(--danger);background:transparent;color:var(--danger);font-family:var(--font-body);font-size:15px;line-height:1.2;font-weight:700;cursor:pointer;transition:transform 200ms cubic-bezier(.2,.7,.2,1), background-color 150ms ease;width:{{ width }};opacity:{{ opacity }}" style-hover="background:var(--twilight);transform:translateY(-1px)" style-active="transform:translateY(0) scale(0.97)">{{ label }}</button>
</sc-if>
</x-dc>
