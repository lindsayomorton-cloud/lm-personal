<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="uploads/the-coven/docs/design/theme.css">
</helmet>
<a href="{{ v.href }}" onMouseEnter="{{ open }}" onMouseLeave="{{ close }}" onFocus="{{ open }}" onBlur="{{ close }}" style="display:flex;flex-direction:column;height:100%;background:var(--dusk);border:1px solid var(--outline);border-radius:var(--radius-lg);overflow:hidden;text-decoration:none;color:var(--moonlight);font-family:var(--font-body);transition:box-shadow 250ms ease, transform 350ms cubic-bezier(.2,.7,.2,1);transform:translateY({{ lift }});box-shadow:{{ shadow }}">
<div style="position:relative;height:260px;flex:none;background:{{ v.banner }}">
<div aria-hidden="true" style="position:absolute;inset:0;opacity:{{ decoOpacity }};transform:translateY({{ decoShift }}) scale({{ decoScale }});transition:opacity 300ms ease, transform 600ms cubic-bezier(.2,.7,.2,1)">
<span style="position:absolute;right:56px;top:40px;width:64px;height:64px;border-radius:50%;box-shadow:inset 16px -6px 0 0 var(--lavender);transform:rotate(-25deg)"></span>
<svg width="22" height="22" viewBox="0 0 24 24" style="position:absolute;right:150px;top:34px;fill:var(--moonlight)"><path d="M12 0C12.9 7.7 16.3 11.1 24 12C16.3 12.9 12.9 16.3 12 24C11.1 16.3 7.7 12.9 0 12C7.7 11.1 11.1 7.7 12 0Z"></path></svg>
<svg width="12" height="12" viewBox="0 0 24 24" style="position:absolute;right:36px;top:136px;fill:var(--mint)"><path d="M12 0C12.9 7.7 16.3 11.1 24 12C16.3 12.9 12.9 16.3 12 24C11.1 16.3 7.7 12.9 0 12C7.7 11.1 11.1 7.7 12 0Z"></path></svg>
<span style="position:absolute;right:120px;top:120px;width:5px;height:5px;border-radius:50%;background:var(--lavender)"></span>
<span style="position:absolute;right:210px;top:86px;width:4px;height:4px;border-radius:50%;background:var(--mint)"></span>
<span style="position:absolute;right:190px;top:160px;width:3px;height:3px;border-radius:50%;background:var(--moonlight)"></span>
<span style="position:absolute;left:44%;top:28px;width:3px;height:3px;border-radius:50%;background:var(--lavender)"></span>
</div>
<div style="position:absolute;inset:0;padding:var(--space-6) var(--space-6) 72px;display:flex;flex-direction:column;justify-content:flex-end;gap:var(--space-4);background:color-mix(in srgb, var(--dusk) 94%, transparent);opacity:{{ revealOpacity }};transform:translateY({{ revealShift }});transition:opacity 300ms ease, transform 400ms cubic-bezier(.2,.7,.2,1);pointer-events:none">
<figure style="margin:0;display:flex;flex-direction:column;gap:var(--space-1)">
<blockquote style="margin:0;font-family:var(--font-display);font-style:italic;font-size:20px;line-height:1.45;color:var(--moonlight)"><span aria-hidden="true" style="color:var(--peach);margin-right:var(--space-1)">“</span>{{ v.ownerQuote }}</blockquote>
<figcaption style="font-size:14px;line-height:1.5;color:var(--mist)">{{ v.ownerBy }}</figcaption>
</figure>
<sc-if value="{{ v.hasCustomerQuote }}" hint-placeholder-val="{{ true }}">
<figure style="margin:0;display:flex;flex-direction:column;gap:var(--space-1)">
<blockquote style="margin:0;font-size:14px;line-height:1.5;font-style:italic;color:var(--moonlight)"><span aria-hidden="true" style="color:var(--peach);font-family:var(--font-display);margin-right:var(--space-1)">“</span>{{ v.customerQuote }}</blockquote>
<figcaption style="font-size:14px;line-height:1.5;color:var(--mist)">{{ v.customerBy }}</figcaption>
</figure>
</sc-if>
</div>
<div style="position:absolute;left:var(--space-6);bottom:-52px;width:116px;height:116px;z-index:2;transform:rotate({{ logoTilt }});transition:transform 400ms cubic-bezier(.2,.7,.2,1)">
<div aria-hidden="true" style="width:100px;height:100px;border-radius:var(--radius-md);background:{{ v.logoBg }};border:3px solid var(--dusk);display:grid;place-items:center;font-family:var(--font-display);font-size:40px;color:var(--lavender)"></div>
<div aria-hidden="true" style="position:absolute;right:0;bottom:0;width:56px;height:56px;border-radius:50%;background:{{ v.faceBg }};border:2px solid var(--violet);display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--moonlight)"></div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:var(--space-3);padding:calc(52px + var(--space-4)) var(--space-6) var(--space-6);flex:1">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:var(--space-1) var(--space-4)">
<h2 style="margin:0;font-family:var(--font-display);font-size:26px;line-height:1.2;font-weight:500">{{ v.name }}</h2>

{{ v.metaText }}</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:auto">

</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;560px&quot;,&quot;height&quot;:&quot;460px&quot;},&quot;vendor&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;href&quot;:&quot;#&quot;,&quot;name&quot;:&quot;Vera's Hearth&quot;,&quot;initial&quot;:&quot;V&quot;,&quot;ownerInitials&quot;:&quot;VM&quot;,&quot;hasRating&quot;:true,&quot;metaText&quot;:&quot;4.9 · 32 reviews · Chicago, IL&quot;,&quot;ownerQuote&quot;:&quot;Every candle is poured under a full moon, with herbs from my own garden.&quot;,&quot;ownerBy&quot;:&quot;Vera, owner&quot;,&quot;hasCustomerQuote&quot;:true,&quot;customerQuote&quot;:&quot;The candle smells like a summer garden after rain, and it was packed with so much care.&quot;,&quot;customerBy&quot;:&quot;Bea, customer&quot;,&quot;specialties&quot;:[{&quot;text&quot;:&quot;Candles &amp; Incense&quot;},{&quot;text&quot;:&quot;Herbs &amp; Oils&quot;},{&quot;text&quot;:&quot;Tarot &amp; Oracle Readings&quot;}],&quot;banner&quot;:&quot;radial-gradient(circle at 78% 22%, color-mix(in srgb, var(--violet) 60%, transparent), transparent 55%), radial-gradient(circle at 12% 95%, color-mix(in srgb, var(--mint) 22%, transparent), transparent 50%), var(--twilight)&quot;},&quot;tsType&quot;:&quot;VendorCardData&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = !!this.props.revealed;
    const v = this.props.vendor || {};
    return {
      v: { banner: 'var(--twilight)', logoBg: 'var(--twilight)', faceBg: 'var(--twilight)', ...v },
      open: () => this.props.onEnter && this.props.onEnter(),
      close: () => this.props.onLeave && this.props.onLeave(),
      revealOpacity: h ? 1 : 0,
      decoOpacity: h ? 0 : 1,
      shadow: h ? 'var(--glow-mint)' : 'none', lift: h ? '-4px' : '0px', decoShift: h ? '-12px' : '0px', decoScale: h ? 1.05 : 1, revealShift: h ? '0px' : '10px', logoTilt: h ? '-3deg' : '0deg'
    };
  }
}
</script>
</body>
</html>
