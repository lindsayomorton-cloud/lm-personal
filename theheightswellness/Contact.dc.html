<!DOCTYPE html>
<html>
<head>
<!-- Google Analytics -->
<script>(function(){if(window.__lmGA)return;window.__lmGA=1;try{if(window.top!==window.self)return;}catch(e){return;}var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-KCB2MVHZG7';document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments);};gtag('js',new Date());gtag('config','G-KCB2MVHZG7',{page_location:location.href,page_referrer:document.referrer});})();</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Allura&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="_ds/organic-3bf144cd-0f77-4d21-b523-8671b888de01/styles.css">
<script src="_ds/organic-3bf144cd-0f77-4d21-b523-8671b888de01/_ds_bundle.js"></script>
<style>body{--font-heading:'Cormorant Garamond',Georgia,serif;--color-bg:#ffffff;--color-surface:#f5dcd5;--color-accent:#201e1d;--sage:#d3dac3;--sky:#c1d6e8;--lav:#ecdff5;--blush:#f5dcd5;--peach:#fdcba1;margin:0;background:var(--color-bg);font-family:var(--font-body);color:var(--color-text)}a{color:var(--color-text)}a:hover{color:var(--color-neutral-700)}</style>
<script src="./hw-polish.js"></script>
<style>html{scroll-behavior:smooth}</style>
</helmet>
<div style="overflow:hidden">
  <dc-import name="HWHeader" active="Contact" hint-size="100%,130px"></dc-import>

  <section data-screen-label="Contact" style="max-width:1440px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(20px,5vw,64px);box-sizing:border-box;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(40px,6vw,96px);align-items:start">
    <div style="display:flex;flex-direction:column;gap:24px">
      <span style="display:flex;align-items:center;gap:14px;font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--color-neutral-600)"><span style="width:36px;height:1px;background:currentColor"></span>Contact</span>
      <h1 style="margin:0;font-family:var(--font-heading);font-weight:500;font-size:clamp(42px,6vw,88px);line-height:.95">Come <span style="font-family:'Allura',cursive;font-weight:400;font-size:1.15em">visit.</span></h1>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">
        <a href="https://maps.google.com/?q=3168+Heights+Village+Vestavia+Hills+AL+35243" target="_blank" rel="noopener" style="padding:24px;background-image:linear-gradient(135deg,var(--peach),var(--blush));text-decoration:none;display:flex;flex-direction:column;gap:8px"><span style="font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase">Address</span><span style="font-family:var(--font-heading);font-weight:500;font-size:22px;line-height:1.25">3168 Heights Village<br>Vestavia Hills, AL 35243</span></a>
        <a href="tel:2054901300" style="padding:24px;background-image:linear-gradient(135deg,var(--sky),var(--lav));text-decoration:none;display:flex;flex-direction:column;gap:8px"><span style="font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase">Phone</span><span style="font-family:var(--font-heading);font-weight:500;font-size:22px">(205) 490-1300</span></a>
        <a href="mailto:info@glowheightswellness.com" style="grid-column:1 / -1;padding:24px;background-image:linear-gradient(135deg,var(--sage),var(--sky));text-decoration:none;display:flex;flex-direction:column;gap:8px"><span style="font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase">Email</span><span style="font-family:var(--font-heading);font-weight:500;font-size:22px;word-break:break-word">info@glowheightswellness.com</span></a>
      </div>
      <div style="display:flex;flex-direction:column">
        <span style="font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;padding-bottom:8px">Hours</span>
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="4"><div style="display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid rgba(32,30,29,.12);font-size:16px"><span style="font-weight:{{ h.w }}">{{ h.d }}</span><span style="font-weight:{{ h.w }}">{{ h.t }}</span></div></sc-for>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:24px">
      <div style="position:relative;aspect-ratio:4/3;background:var(--lav);overflow:hidden"><iframe title="Map to Heights Wellness" src="https://maps.google.com/maps?q=3168%20Heights%20Village%2C%20Vestavia%20Hills%2C%20AL%2035243&amp;z=15&amp;output=embed" style="position:absolute;inset:0;width:100%;height:100%;border:0;filter:grayscale(.6) contrast(.95)" loading="lazy"></iframe></div>
      <div style="background:var(--color-bg);padding:clamp(24px,3vw,40px);border:1px solid rgba(32,30,29,.1)">
        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{ submit }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px 24px">
            <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--color-neutral-700)">Name</span><input required="" style="font:inherit;font-size:17px;padding:10px 0;border:none;border-bottom:1px solid rgba(32,30,29,.35);background:transparent;outline:none;border-radius:0"></label>
            <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--color-neutral-700)">Email</span><input type="email" required="" style="font:inherit;font-size:17px;padding:10px 0;border:none;border-bottom:1px solid rgba(32,30,29,.35);background:transparent;outline:none;border-radius:0"></label>
            <label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px"><span style="font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--color-neutral-700)">Message</span><textarea rows="3" required="" style="font:inherit;font-size:17px;padding:10px 0;border:none;border-bottom:1px solid rgba(32,30,29,.35);background:transparent;outline:none;resize:vertical;border-radius:0"></textarea></label>
            <button type="submit" style="grid-column:1 / -1;justify-self:start;text-decoration:none;color:var(--color-bg);background:var(--color-text);padding:16px 28px;border:none;border-radius:999px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer">Send message</button>
          </form>
        </sc-if>
        <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-family:var(--font-heading);font-weight:500;font-size:28px">Thank you. We'll be in touch soon.</p></sc-if>
      </div>
    </div>
  </section>

  <dc-import name="HWFooter" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sent: false };
  renderVals() {
    const day = new Date().getDay();
    return {
      hours: [['Mon – Thu', '9 am – 6 pm', [1, 2, 3, 4]], ['Friday', '9 am – 3 pm', [5]], ['Saturday', '10 am – 4 pm', [6]], ['Sunday', '11 am – 3 pm', [0]]].map(([d, t, ds]) => ({ d: ds.includes(day) ? d + ' · Today' : d, t, w: ds.includes(day) ? 700 : 400 })),
      sent: this.state.sent, notSent: !this.state.sent,
      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); },
    };
  }
}
</script>
</body>
</html>
