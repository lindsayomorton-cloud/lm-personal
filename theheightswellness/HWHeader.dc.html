<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-3bf144cd-0f77-4d21-b523-8671b888de01/styles.css">
<script src="_ds/organic-3bf144cd-0f77-4d21-b523-8671b888de01/_ds_bundle.js"></script>
<style>@keyframes hw-pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}</style>
</helmet>
<div>
  <div style="background:linear-gradient(90deg,var(--blush),var(--lav) 50%,var(--sky));color:var(--color-text);border-bottom:1px solid rgba(32,30,29,.08)">
    <div style="max-width:1440px;margin:0 auto;padding:12px clamp(20px,5vw,64px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 28px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase">
      <span style="display:flex;align-items:center;gap:14px">
        <span style="position:relative;width:8px;height:8px;flex:none"><span style="position:absolute;inset:0;border-radius:50%;background:{{ openDot }};animation:hw-pulse 2.4s ease-out infinite"></span><span style="position:absolute;inset:0;border-radius:50%;background:{{ openDot }}"></span></span>
        <span>{{ openLabel }}</span><span style="width:1px;height:14px;background:rgba(32,30,29,.2)"></span><span style="font-weight:500;letter-spacing:.14em">{{ openDetail }}</span>
      </span>
      <span style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px">
        <a href="tel:2054901300" style="color:var(--color-text);text-decoration:none;display:inline-flex;align-items:center;min-height:44px;margin:-14px 0">(205) 490-1300</a>
        <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}"><a href="https://maps.google.com/?q=3168+Heights+Village+Vestavia+Hills+AL+35243" target="_blank" rel="noopener" style="color:var(--color-text);text-decoration:none">3168 Heights Village, Vestavia Hills</a></sc-if>
      </span>
    </div>
  </div>
  <header style="border-bottom:1px solid rgba(32,30,29,.08);max-width:1440px;margin:0 auto;padding:clamp(14px,2vw,22px) clamp(16px,5vw,64px);box-sizing:border-box;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(8px,2vw,24px)">
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:clamp(18px,2vw,32px)">
        <sc-for list="{{ navL }}" as="n" hint-placeholder-count="3"><a href="{{ n.href }}" style="font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;color:var(--color-text);padding:8px 0;border-bottom:1px solid {{ n.line }}" style-hover="border-bottom-color:var(--color-text)">{{ n.t }}</a></sc-for>
      </nav>
    </sc-if>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}"><button onClick="{{ toggleMenu }}" aria-label="Menu" style="justify-self:start;display:flex;align-items:center;gap:10px;background:none;border:none;padding:8px 0;cursor:pointer;color:var(--color-text);font:inherit;font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase"><span style="display:flex;flex-direction:column;gap:5px"><span style="width:22px;height:1.5px;background:currentColor"></span><span style="width:14px;height:1.5px;background:currentColor"></span></span>Menu</button></sc-if>
    <a href="Heights%20Wellness%20v2.dc.html" style="display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--color-text);line-height:1"><span style="font-family:var(--font-heading);font-weight:500;font-size:clamp(28px,2.6vw,36px);letter-spacing:.04em">Heights</span><span style="margin-top:6px;font-size:9px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;color:var(--color-neutral-700);padding-left:.42em">Wellness &amp; Aesthetics</span></a>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:clamp(18px,2vw,32px)">
      <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ navR }}" as="n" hint-placeholder-count="2"><a href="{{ n.href }}" style="font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;color:var(--color-text);padding:8px 0;border-bottom:1px solid {{ n.line }}" style-hover="border-bottom-color:var(--color-text)">{{ n.t }}</a></sc-for>
      </sc-if>
      <a href="Book.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--color-text);padding:{{ bookPad }};border:1px solid rgba(32,30,29,.25);border-radius:999px;transition:background .3s,border-color .3s" style-hover="background:var(--color-bg);border-color:var(--color-text)"><sc-if value="{{ showBookLabel }}" hint-placeholder-val="{{ true }}"><span style="font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap">Book</span></sc-if><span style="width:36px;height:36px;border-radius:50%;background-image:linear-gradient(135deg,var(--peach),var(--blush));display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span></a>
    </div>
  </header>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--blush),var(--lav) 55%,var(--sky));padding:24px clamp(20px,5vw,64px);display:flex;flex-direction:column;gap:28px;overflow:auto">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--font-heading);font-weight:500;font-size:28px">Heights</span><button onClick="{{ toggleMenu }}" aria-label="Close menu" style="width:48px;height:48px;border-radius:50%;border:1px solid rgba(32,30,29,.25);background:none;cursor:pointer;color:var(--color-text);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
      <nav style="display:flex;flex-direction:column">
        <sc-for list="{{ navAll }}" as="n" hint-placeholder-count="6"><a href="{{ n.href }}" style="font-family:var(--font-heading);font-weight:500;font-size:40px;line-height:1.1;text-decoration:none;color:var(--color-text);padding:10px 0;border-bottom:1px solid rgba(32,30,29,.1)">{{ n.t }}</a></sc-for>
      </nav>
      <a href="Book.dc.html" style="align-self:flex-start;text-decoration:none;color:var(--color-bg);background:var(--color-text);padding:16px 28px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase">Book a Consultation</a>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:14px"><a href="tel:2054901300" style="color:var(--color-text)">(205) 490-1300</a><span>3168 Heights Village, Vestavia Hills, AL 35243</span></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;About&quot;,&quot;Services&quot;,&quot;Memberships&quot;,&quot;FAQ&quot;,&quot;Contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, menu: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const active = this.props.active ?? '';
    const mk = (t, href) => ({ t, href, line: t === active ? 'var(--color-text)' : 'transparent' });
    const L = [mk('About', 'About.dc.html'), mk('Services', 'Services.dc.html'), mk('Memberships', 'Memberships.dc.html')];
    const Rr = [mk('FAQ', 'FAQ.dc.html'), mk('Contact', 'Contact.dc.html')];
    const S = { 0: [11, 15], 1: [9, 18], 2: [9, 18], 3: [9, 18], 4: [9, 18], 5: [9, 15], 6: [10, 16] };
    const fmt = (x) => (x % 12 || 12) + (x < 12 ? ' am' : ' pm');
    const now = new Date(), d = now.getDay(), t = now.getHours() + now.getMinutes() / 60, [o, c] = S[d];
    let open;
    if (t >= o && t < c) open = { openLabel: 'Open now', openDetail: 'Today ' + fmt(o) + ' – ' + fmt(c), openDot: '#5f9a63' };
    else if (t < o) open = { openLabel: 'Closed now', openDetail: 'Opens today at ' + fmt(o), openDot: '#c67139' };
    else open = { openLabel: 'Closed now', openDetail: 'Opens tomorrow at ' + fmt(S[(d + 1) % 7][0]), openDot: '#c67139' };
    const wide = this.state.w >= 900;
    return {
      ...open, wide, showBookLabel: this.state.w >= 420, bookPad: this.state.w >= 420 ? '4px 4px 4px 18px' : '4px', narrow: !wide, menuOpen: !wide && this.state.menu,
      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),
      navL: L, navR: Rr, navAll: [{ t: 'Home', href: 'Heights%20Wellness%20v2.dc.html' }, ...L, ...Rr],
    };
  }
}
</script>
</body>
</html>
